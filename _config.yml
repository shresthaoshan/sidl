# GitHub Pages site: https://shresthaoshan.github.io/sidl/
remote_theme: mmistakes/minimal-mistakes@4.28.1
minimal_mistakes_skin: default  # also: air, aqua, contrast, dark, dirt, mint, neon, plum, sunrise, catppuccin_latte, catppuccin_mocha

title: Sidl
description: Gestures for the edges and corners of your Mac trackpad.
repository: shresthaoshan/sidl
url: https://shresthaoshan.github.io
baseurl: /sidl

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

# README.md is the home page. CONTRIBUTING.md and LICENSE are published too, so the README's links work.
exclude:
  - Package.swift
  - Sources
  - Tests
  - scripts
  - "*.app"

# The page title comes from each file's first heading, so remove that heading from the text.
titles_from_headings:
  strip_title: true

defaults:
  - scope:
      path: ""
    values:
      layout: single
      author_profile: false
      toc: true          # table of contents from the page's headings
      toc_sticky: true
